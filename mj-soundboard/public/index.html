<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>MJ Soundboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0716; --panel: #1b1030; --rim: #3a2466; --text: #f5e9ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #2a0f4a, var(--bg) 70%);
    color: var(--text); font-family: "Press Start 2P", monospace;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px; user-select: none;
  }
  h1 {
    font-size: clamp(16px, 5vw, 32px); margin: 0 0 6px; letter-spacing: 2px;
    color: #fff; text-shadow: 0 0 6px #ff2d55, 0 0 18px #ff2d55, 3px 3px 0 #30b0ff;
  }
  .sub { font-size: 10px; opacity: .7; margin-bottom: 20px; animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  .cabinet {
    width: min(100%, 560px); padding: 22px; border-radius: 22px;
    background: linear-gradient(180deg, var(--panel), #120a22);
    border: 4px solid var(--rim);
    box-shadow: inset 0 2px 0 #ffffff22, 0 20px 50px #000a;
  }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(14px, 4vw, 24px) clamp(14px, 4vw, 24px); }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  button.vinyl {
    --c: #c8102e;
    position: relative; width: 100%; aspect-ratio: 1; border-radius: 50%;
    border: 0; padding: 0; cursor: pointer;
    background:
      conic-gradient(from 30deg, #ffffff00 0 10%, #ffffff22 14%, #ffffff00 20% 55%, #ffffff1a 60%, #ffffff00 66%),
      repeating-radial-gradient(circle, #111 0 1px, #1c1c1c 1.5px 2.5px, #0d0d0d 3px);
    box-shadow: 0 0 0 3px #000, 0 8px 18px #000c;
    animation: spin 1.8s linear infinite paused;
    transition: transform .08s, box-shadow .08s;
  }
  button.vinyl .lbl {
    position: absolute; inset: 24%; border-radius: 50%;
    background: var(--c) center/cover no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--ink, #fff); font-size: clamp(4px, 1.25vw, 7px); line-height: 1.25; text-align: center;
    box-shadow: inset 0 0 0 2px #0004;
  }
  button.vinyl .lbl.cover { font-size: 0; }
  button.vinyl .lbl::after {
    content: ""; position: absolute; width: 7%; height: 7%; border-radius: 50%;
    background: #0b0716; top: 46.5%; left: 46.5%;
  }
  button.vinyl .lbl b, button.vinyl .lbl i {
    position: absolute; left: 10%; right: 10%; font-weight: normal; font-style: normal;
  }
  button.vinyl .lbl b { bottom: 57%; }
  button.vinyl .lbl i { top: 60%; opacity: .8; }
  button.vinyl.on { animation-play-state: running; transform: scale(.94);
    box-shadow: 0 0 0 3px #000, 0 0 26px 6px var(--c); }
  @keyframes spin { to { rotate: 360deg; } }
  .label { font-size: clamp(6px, 1.8vw, 9px); text-align: center; line-height: 1.4; min-height: 2.8em; margin-top: 4px; }
  .key { opacity: .45; }
  footer { margin-top: 22px; font-size: 8px; opacity: .5; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
  <h1>MJ SOUNDBOARD</h1>
  <div class="sub">DROP THE NEEDLE · PRESS ANY RECORD</div>
  <div class="cabinet"><div class="grid" id="grid"></div></div>
  <footer>Teclado: 1234 · QWER · ASDF · ZXCV<br>Uso privado · sonidos © sus titulares</footer>
<script>
(async () => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const grid = document.getElementById('grid');
  const sounds = await fetch('sounds.json').then(r => r.json());
  const buffers = {}, byKey = {};

  // Si falta el mp3, suena un "blip" de 8 bits para que el botón no quede mudo.
  function blip(i) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(220 * Math.pow(2, i / 5), ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(880 * Math.pow(2, i / 8), ctx.currentTime + 0.15);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.25);
  }

  function play(s, i, btn) {
    if (ctx.state === 'suspended') ctx.resume();
    const buf = buffers[s.id];
    if (buf) {
      const src = ctx.createBufferSource();
      src.buffer = buf; src.connect(ctx.destination); src.start();
    } else blip(i);
    const ms = buf ? buf.duration * 1000 : 300;
    btn.classList.add('on');
    clearTimeout(btn._t);
    btn._t = setTimeout(() => btn.classList.remove('on'), ms);
    navigator.vibrate?.(15);
  }

  sounds.forEach((s, i) => {
    const cell = document.createElement('div'); cell.className = 'cell';
    const btn = document.createElement('button');
    btn.className = 'vinyl'; btn.style.setProperty('--c', s.color);
    btn.setAttribute('aria-label', `${s.label} (${s.album})`);
    const lbl = document.createElement('div'); lbl.className = 'lbl';
    lbl.innerHTML = `<b>${s.album}</b><i>${s.year}</i>`;
    const [r, g, b] = s.color.match(/\w\w/g).map(h => parseInt(h, 16));
    if (r * .3 + g * .59 + b * .11 > 160) lbl.style.setProperty('--ink', '#111');
    btn.append(lbl);
    // Portada opcional como galleta del vinilo.
    const img = new Image();
    img.onload = () => { lbl.style.backgroundImage = `url(${img.src})`; lbl.classList.add('cover'); };
    img.src = `covers/${s.id}.jpg`;
    btn.addEventListener('pointerdown', e => { e.preventDefault(); play(s, i, btn); });
    const lab = document.createElement('div'); lab.className = 'label';
    lab.innerHTML = `${s.label}<br><span class="key">[${s.key.toUpperCase()}]</span>`;
    cell.append(btn, lab); grid.append(cell);
    byKey[s.key.toLowerCase()] = () => play(s, i, btn);

    fetch(`sounds/${s.id}.mp3`)
      .then(r => r.ok ? r.arrayBuffer() : Promise.reject())
      .then(a => ctx.decodeAudioData(a))
      .then(b => { buffers[s.id] = b; })
      .catch(() => {});
  });

  addEventListener('keydown', e => { if (!e.repeat) byKey[e.key.toLowerCase()]?.(); });
})();
</script>
</body>
</html>
