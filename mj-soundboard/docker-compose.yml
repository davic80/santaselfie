# mj-soundboard — solo la app, detrás del Caddy compartido (igual que santaselfie).
#
#   1) PROXY_NETWORK en .env = la red del Caddy existente
#   2) docker compose up -d
#   3) Añade el bloque de ./Caddyfile al Caddyfile del servidor y recarga:
#        docker exec <caddy> caddy reload --config /etc/caddy/Caddyfile

services:
  mj-soundboard:
    image: ghcr.io/davic80/mj-soundboard:${MJ_SOUNDBOARD_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      proxy:
        aliases:
          - mj-soundboard

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK in .env to your existing Caddy network}
