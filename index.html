<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f3d2e">
  <title>Selfie navideña — corta y pinta la barba</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎅</text></svg>">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <main class="app">
    <div class="stage">
      <canvas id="stage"></canvas>
    </div>
    <!-- En horizontal `.rails` es display:contents y cada raíl se coloca a un
         lado del personaje; en vertical los dos caen juntos a la barra de abajo. -->
    <div class="rails">
      <div id="rail-left" class="rail rail--left"></div>
      <div id="rail-right" class="rail rail--right"></div>
    </div>
  </main>
  <div id="cursor" class="cursor" aria-hidden="true"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
